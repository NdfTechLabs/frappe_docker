name: NDF / Validate

on:
  push:
    branches:
      - main
    paths:
      - "images/ndf/**"
      - "requirements-test.txt"
      - ".github/workflows/ndf-validate.yml"
  pull_request:
    paths:
      - "images/ndf/**"
      - "requirements-test.txt"
      - ".github/workflows/ndf-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests, locks and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Install policy-pinned uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Verify pinned uv CLI contract
        shell: bash
        run: |
          set -euo pipefail
          uv --version | grep -E '^uv 0\\.13\\.7($|[[:space:]])'
          uv pip compile --help > "${RUNNER_TEMP}/uv-pip-compile-help.txt"
          for option in --format --python-version --python-platform --no-build --no-config --no-cache; do
            grep -F -- "${option}" "${RUNNER_TEMP}/uv-pip-compile-help.txt" >/dev/null
          done
          grep -F "pylock.toml" "${RUNNER_TEMP}/uv-pip-compile-help.txt" >/dev/null

      - name: Validate image definitions
        run: python images/ndf/scripts/validate_image_definitions.py

      - name: Validate product build inputs
        shell: bash
        run: |
          set -euo pipefail

          for image in \
            dhanaerp-master-v16 \
            dalali-v16 \
            vincowoods-v16
          do
            echo "::group::Prepare ${image}"
            python images/ndf/scripts/prepare_build.py \
              --image "${image}" \
              --output-dir "${RUNNER_TEMP}/ndf-build/${image}"
            echo "::endgroup::"
          done

      - name: Run NDF tests
        if: always()
        run: python -m pytest images/ndf/tests/ -v

      - name: Compile NDF scripts
        if: always()
        run: python -m compileall -q images/ndf/scripts/
