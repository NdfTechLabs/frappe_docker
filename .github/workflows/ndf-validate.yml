name: NDF / Validate

on:
  push:
    branches:
      - main
    paths:
      - "images/ndf/**"
      - "requirements-test.txt"
      - ".github/workflows/ndf-validate.yml"
  pull_request:
    paths:
      - "images/ndf/**"
      - "requirements-test.txt"
      - ".github/workflows/ndf-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ndf-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests, locks and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Validate image definitions
        run: python images/ndf/scripts/validate_image_definitions.py

      # Product lock-v1 files are obsolete and are not validation inputs.
      # M4.2.4 will add per-build lock-v2 generation from current manifests and
      # requested rolling refs before product build-input validation is restored.

      - name: Run NDF tests
        if: always()
        run: python -m pytest images/ndf/tests/ -v

      - name: Compile NDF scripts
        if: always()
        run: python -m compileall -q images/ndf/scripts/
