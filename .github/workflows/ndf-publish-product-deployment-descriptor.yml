name: NDF / Publish Product Deployment Descriptor

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful NDF Publish Product Images run ID
        required: true
        type: string
      build_artifact_name:
        description: Exact original build evidence artifact name
        required: true
        type: string
      verification_run_id:
        description: Successful NDF Verify Product Deployment Binding run ID
        required: true
        type: string
      verification_artifact_name:
        description: Exact verified descriptor/report artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: ndf-pdd-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified PDD OCI artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
    outputs:
      pdd_reference: ${{ steps.binding.outputs.pdd_reference }}
      signing_input_artifact: ${{ steps.binding.outputs.signing_input_artifact }}
    env:
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BUILD_ARTIFACT_NAME: ${{ inputs.build_artifact_name }}
      VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
      VERIFICATION_ARTIFACT_NAME: ${{ inputs.verification_artifact_name }}
      GH_TOKEN: ${{ github.token }}
      EVIDENCE_DIR: ${{ github.workspace }}/.ndf-pdd-publication-evidence
      VERIFICATION_DIR: ${{ github.workspace }}/.ndf-pdd-verification
      SOURCE_TRUST_DIR: ${{ github.workspace }}/.ndf-source-image-trust
    steps:
      - name: Checkout publication code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2.0.3
        with:
          version: 1.3.6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate source runs and artifact ownership
        id: source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "PDD publication is restricted to main." >&2; exit 1; }
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid build_run_id" >&2; exit 1; }
          [[ "$VERIFICATION_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid verification_run_id" >&2; exit 1; }

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs?per_page=100" > "$RUNNER_TEMP/build-jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFICATION_RUN_ID" > "$RUNNER_TEMP/verification-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/build-artifacts.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFICATION_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/verification-artifacts.json"

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          build = json.loads(Path(os.environ["RUNNER_TEMP"], "build-run.json").read_text())
          build_jobs = json.loads(Path(os.environ["RUNNER_TEMP"], "build-jobs.json").read_text())
          verification = json.loads(Path(os.environ["RUNNER_TEMP"], "verification-run.json").read_text())
          build_artifacts = json.loads(Path(os.environ["RUNNER_TEMP"], "build-artifacts.json").read_text())
          verification_artifacts = json.loads(Path(os.environ["RUNNER_TEMP"], "verification-artifacts.json").read_text())

          build_id = os.environ["BUILD_RUN_ID"]
          verification_id = os.environ["VERIFICATION_RUN_ID"]
          build_name = os.environ["BUILD_ARTIFACT_NAME"]
          verification_name = os.environ["VERIFICATION_ARTIFACT_NAME"]

          if build.get("status") != "completed" or build.get("conclusion") != "success":
              raise SystemExit("Source image build run must have completed successfully.")
          if build.get("path") != ".github/workflows/ndf-publish-product.yml":
              raise SystemExit("Source run is not NDF / Publish Product Images.")
          if build.get("head_branch") != "main":
              raise SystemExit("Source image build must have run from main.")
          if str(build.get("id")) != build_id:
              raise SystemExit("Source build run ID mismatch.")
          build_match = re.fullmatch(r"ndf-publish-(.+)-(\d+)-(\d+)", build_name)
          if not build_match or build_match.group(2) != build_id or int(build_match.group(3)) != build.get("run_attempt"):
              raise SystemExit("Build evidence artifact does not belong to the supplied build run/attempt.")
          image_id = build_match.group(1)
          build_attempt = int(build_match.group(3))
          build_artifact = next((item for item in build_artifacts.get("artifacts", []) if item.get("name") == build_name), None)
          if not build_artifact or build_artifact.get("expired"):
              raise SystemExit("Original build evidence artifact is missing or expired.")

          trust_name = f"ndf-cosign-live-{image_id}-{build_id}-{build_attempt}"
          trust_job_name = f"Live Cosign trust check for {image_id}"
          trust_job = next((item for item in build_jobs.get("jobs", []) if item.get("name") == trust_job_name), None)
          if not trust_job or trust_job.get("conclusion") != "success":
              raise SystemExit(f"Successful source-image Cosign trust job not found: {trust_job_name}.")
          trust_artifact = next((item for item in build_artifacts.get("artifacts", []) if item.get("name") == trust_name), None)
          if not trust_artifact or trust_artifact.get("expired"):
              raise SystemExit("Exact attempt-scoped source-image Cosign trust artifact is missing or expired.")

          if verification.get("status") != "completed" or verification.get("conclusion") != "success":
              raise SystemExit("PDD binding verification run must have completed successfully.")
          if verification.get("head_branch") != "main":
              raise SystemExit("PDD binding verification must have run from main.")
          if verification.get("path") != ".github/workflows/ndf-verify-product-deployment-binding.yml":
              raise SystemExit("Verification run is not NDF / Verify Product Deployment Binding.")
          if str(verification.get("id")) != verification_id:
              raise SystemExit("Verification run ID mismatch.")
          verification_match = re.fullmatch(r"ndf-pdd-binding-(\d+)-(\d+)", verification_name)
          if not verification_match or verification_match.group(1) != build_id or int(verification_match.group(2)) != verification.get("run_attempt"):
              raise SystemExit("PDD verification artifact does not belong to the supplied source build.")
          verification_artifact = next((item for item in verification_artifacts.get("artifacts", []) if item.get("name") == verification_name), None)
          if not verification_artifact or verification_artifact.get("expired"):
              raise SystemExit("Verified descriptor/report artifact is missing or expired.")

          print(f"Source image build: {build['html_url']}")
          print(f"Source-image Cosign trust job: {trust_job_name}")
          print(f"Source-image trust evidence: {trust_name}")
          print(f"Binding verification: {verification['html_url']}")
          print(f"Build evidence: {build_name}")
          print(f"Verified descriptor/report: {verification_name}")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"source_trust_artifact_name={trust_name}\n")
          PY

      - name: Download original build evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR" "$VERIFICATION_DIR" "$SOURCE_TRUST_DIR"
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BUILD_ARTIFACT_NAME" --dir "$EVIDENCE_DIR"
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "${{ steps.source.outputs.source_trust_artifact_name }}" --dir "$SOURCE_TRUST_DIR"
          gh run download "$VERIFICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$VERIFICATION_ARTIFACT_NAME" --dir "$VERIFICATION_DIR"
          test -s "$EVIDENCE_DIR/build-result.json"
          test -s "$EVIDENCE_DIR/image-provenance-predicate.json"
          test -s "$SOURCE_TRUST_DIR/image-provenance-predicate.json"
          test -s "$SOURCE_TRUST_DIR/cosign-live-verification-result.json"
          cmp "$EVIDENCE_DIR/image-provenance-predicate.json" "$SOURCE_TRUST_DIR/image-provenance-predicate.json"
          test -s "$VERIFICATION_DIR/product-deployment.json"
          test -s "$VERIFICATION_DIR/binding-verification.json"
          cp "$VERIFICATION_DIR/product-deployment.json" "$EVIDENCE_DIR/product-deployment.json"
          cp "$VERIFICATION_DIR/binding-verification.json" "$EVIDENCE_DIR/binding-verification.json"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate ORAS to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish PDD and verified evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          python images/ndf/scripts/publish_product_deployment_descriptor.py \
            --descriptor "$EVIDENCE_DIR/product-deployment.json" \
            --evidence-dir "$EVIDENCE_DIR" \
            --publication-record "$RUNNER_TEMP/pdd-publication-record.json"

      - name: Generate deterministic PDD binding statement and predicate
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          python images/ndf/scripts/generate_pdd_image_binding.py \
            --descriptor "$EVIDENCE_DIR/product-deployment.json" \
            --publication-record "$RUNNER_TEMP/pdd-publication-record.json" \
            --source-trust-result "$SOURCE_TRUST_DIR/cosign-live-verification-result.json" \
            --source-predicate "$SOURCE_TRUST_DIR/image-provenance-predicate.json" \
            --statement-output "$RUNNER_TEMP/pdd-image-binding-statement.json" \
            --predicate-output "$RUNNER_TEMP/pdd-image-binding-predicate.json"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          record = json.loads(Path(os.environ["RUNNER_TEMP"], "pdd-publication-record.json").read_text())
          reference = record["artifact"]["immutable_reference"]
          expected = f"{record['artifact']['repository']}@{record['artifact']['digest']}"
          if reference != expected:
              raise SystemExit("Publication receipt immutable reference mismatch.")
          print(f"pdd_reference={reference}")
          print(f"signing_input_artifact=ndf-pdd-signing-input-{os.environ['BUILD_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}")
          PY

      - name: Upload PDD signing inputs
        uses: actions/upload-artifact@v7
        with:
          name: ndf-pdd-signing-input-${{ inputs.build_run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pdd-publication-record.json
            ${{ runner.temp }}/pdd-image-binding-statement.json
            ${{ runner.temp }}/pdd-image-binding-predicate.json
          if-no-files-found: error
          retention-days: 90

      - name: Write publication summary
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          record = json.loads(Path(os.environ["RUNNER_TEMP"], "pdd-publication-record.json").read_text())
          print("## Product Deployment Descriptor Publication")
          print()
          print(f"- Descriptor: `{record['descriptor']['id']}`")
          print(f"- Image digest: `{record['subject_image']['digest']}`")
          print(f"- Artifact reference: `{record['artifact']['immutable_reference']}`")
          print(f"- Locator tag (discovery only): `{record['artifact']['locator_tag']}`")
          print(f"- Evidence files included: {record['evidence']['count']}")
          print(f"- Published files: {record['evidence']['published_file_count']}")
          print(f"- Publication time: {record['published_at']}")
          PY

      - name: Upload publication receipt
        uses: actions/upload-artifact@v7
        with:
          name: ndf-pdd-publication-${{ inputs.build_run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pdd-publication-record.json
          if-no-files-found: error
          retention-days: 90

  sign-pdd:
    name: Sign and verify published PDD
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout publication code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install trust utility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Download attempt-scoped PDD signing inputs
        uses: actions/download-artifact@v7
        with:
          name: ${{ needs.publish.outputs.signing_input_artifact }}
          path: ${{ runner.temp }}/pdd-signing-input

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate receipt and sign immutable PDD digest
        shell: bash
        env:
          PDD_REFERENCE: ${{ needs.publish.outputs.pdd_reference }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path(os.environ["RUNNER_TEMP"], "pdd-signing-input")
          receipt = json.loads((root / "pdd-publication-record.json").read_text())
          schema = json.loads(Path("images/ndf/schemas/pdd-publication-record-v1.schema.json").read_text())
          Draft202012Validator(
              schema, format_checker=Draft202012Validator.FORMAT_CHECKER
          ).validate(receipt)
          reference = receipt["artifact"]["immutable_reference"]
          expected = f"{receipt['artifact']['repository']}@{receipt['artifact']['digest']}"
          if reference != expected or reference != os.environ["PDD_REFERENCE"]:
              raise SystemExit("Signing reference does not match the validated publication receipt.")
          statement = json.loads((root / "pdd-image-binding-statement.json").read_text())
          predicate = json.loads((root / "pdd-image-binding-predicate.json").read_text())
          if statement.get("_type") != "https://in-toto.io/Statement/v1":
              raise SystemExit("PDD binding statement is not in-toto Statement v1.")
          if statement.get("predicate") != predicate:
              raise SystemExit("PDD binding predicate does not match the generated statement.")
          subject = statement.get("subject", [])
          if len(subject) != 1 or subject[0].get("name") != receipt["artifact"]["repository"]:
              raise SystemExit("PDD binding statement subject repository mismatch.")
          if subject[0].get("digest", {}).get("sha256") != receipt["artifact"]["digest"].removeprefix("sha256:"):
              raise SystemExit("PDD binding statement subject digest mismatch.")
          PY
          python images/ndf/scripts/cosign_pdd_trust.py sign \
            --pdd-ref "$PDD_REFERENCE" \
            --statement "$RUNNER_TEMP/pdd-signing-input/pdd-image-binding-statement.json" \
            --predicate "$RUNNER_TEMP/pdd-signing-input/pdd-image-binding-predicate.json"

      - name: Independently verify PDD signature and binding attestation
        shell: bash
        env:
          PDD_REFERENCE: ${{ needs.publish.outputs.pdd_reference }}
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/pdd-trust-verification-result.json" "$RUNNER_TEMP/pdd-verified-attestation.json" "$RUNNER_TEMP/pdd-verify.log"
          set +e
          python images/ndf/scripts/cosign_pdd_trust.py verify \
            --pdd-ref "$PDD_REFERENCE" \
            --expected-predicate "$RUNNER_TEMP/pdd-signing-input/pdd-image-binding-predicate.json" \
            --result-output "$RUNNER_TEMP/pdd-trust-verification-result.json" \
            --attestation-output "$RUNNER_TEMP/pdd-verified-attestation.json" \
            > "$RUNNER_TEMP/pdd-verify.log" 2>&1
          verify_status=$?
          set -e
          cat "$RUNNER_TEMP/pdd-verify.log"
          if [[ "$verify_status" -ne 1 ]]; then
            echo "Expected the verifier to exit 1 for the provisional identity policy; got $verify_status." >&2
            exit 1
          fi
          grep -Fq "PDD cryptographic verification passed, but signer identity policy is provisional; result is rejected." "$RUNNER_TEMP/pdd-verify.log" || {
            echo "Verifier did not report the exact expected provisional-policy rejection." >&2
            exit 1
          }
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(Path(os.environ["RUNNER_TEMP"], "pdd-trust-verification-result.json").read_text())
          expected_reference = os.environ["PDD_REFERENCE"]
          if result.get("artifact", {}).get("immutable_reference") != expected_reference:
              raise SystemExit("PDD trust result is bound to another immutable reference.")
          if result.get("signature", {}).get("verified") is not True:
              raise SystemExit("PDD signature verification did not pass.")
          if result.get("signer", {}).get("verified") is not True:
              raise SystemExit("PDD signer verification did not pass.")
          transparency = result.get("transparency", {})
          if transparency.get("verified") is not True or transparency.get("log_entry_verified") is not True:
              raise SystemExit("PDD Rekor verification did not pass.")
          attestations = result.get("attestations", [])
          if len(attestations) != 1 or attestations[0].get("verified") is not True:
              raise SystemExit("Expected exactly one verified PDD binding attestation.")
          if attestations[0].get("subject_digest") != result["artifact"]["digest"]:
              raise SystemExit("Verified PDD attestation subject digest mismatch.")
          if result.get("decision") != {
              "status": "rejected",
              "reason_codes": ["IDENTITY_POLICY_PROVISIONAL"],
          }:
              raise SystemExit("PDD verification rejection is not the expected provisional identity-policy result.")
          PY

      - name: Assemble and correlate PDD trust evidence
        shell: bash
        env:
          SOURCE_BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ARTIFACT_NAME: ${{ inputs.build_artifact_name }}
          SIGNING_INPUT_ARTIFACT: ${{ needs.publish.outputs.signing_input_artifact }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_ARTIFACT_NAME" =~ ^ndf-publish-(.+)-([0-9]+)-([0-9]+)$ ]]; then
            [[ "${BASH_REMATCH[2]}" == "$SOURCE_BUILD_RUN_ID" ]] || {
              echo "Source build artifact belongs to another run." >&2
              exit 1
            }
            SOURCE_BUILD_ATTEMPT="${BASH_REMATCH[3]}"
          else
            echo "Validated source build artifact name is malformed." >&2
            exit 1
          fi
          EVIDENCE_DIR="$RUNNER_TEMP/pdd-trust-evidence"
          mkdir -p "$EVIDENCE_DIR"
          cp "$RUNNER_TEMP/pdd-signing-input/pdd-publication-record.json" "$EVIDENCE_DIR/"
          cp "$RUNNER_TEMP/pdd-signing-input/pdd-image-binding-statement.json" "$EVIDENCE_DIR/"
          cp "$RUNNER_TEMP/pdd-signing-input/pdd-image-binding-predicate.json" "$EVIDENCE_DIR/"
          cp "$RUNNER_TEMP/pdd-trust-verification-result.json" "$EVIDENCE_DIR/"
          cp "$RUNNER_TEMP/pdd-verified-attestation.json" "$EVIDENCE_DIR/"
          cp "$RUNNER_TEMP/pdd-verify.log" "$EVIDENCE_DIR/"
          python images/ndf/scripts/correlate_pdd_trust_evidence.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --source-build-run-id "$SOURCE_BUILD_RUN_ID" \
            --source-build-attempt "$SOURCE_BUILD_ATTEMPT" \
            --signing-input-artifact "$SIGNING_INPUT_ARTIFACT"

      - name: Upload correlated PDD trust evidence
        uses: actions/upload-artifact@v7
        with:
          name: ndf-pdd-trust-evidence-${{ inputs.build_run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pdd-trust-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Write PDD trust evidence summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"], "pdd-trust-evidence")
          receipt = json.loads((root / "pdd-publication-record.json").read_text())
          result = json.loads((root / "pdd-trust-verification-result.json").read_text())
          print("## PDD OCI Trust Evidence")
          print()
          print(f"- Descriptor: `{receipt['descriptor']['id']}`")
          print(f"- Immutable PDD reference: `{receipt['artifact']['immutable_reference']}`")
          print(f"- Evidence artifact: `ndf-pdd-trust-evidence-${{ inputs.build_run_id }}-${{ github.run_attempt }}`")
          print(f"- Verified at: {result['verified_at']}")
          print("- Decision: **REJECTED: IDENTITY_POLICY_PROVISIONAL**")
          print()
          print("Cryptographic signature, signer, Rekor and binding-attestation checks passed. The signer identity policy remains provisional; this evidence does not establish a trusted decision.")
          PY
