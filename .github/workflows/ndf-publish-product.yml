name: NDF / Publish Product Images

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product image to publish
        required: true
        type: choice
        default: all
        options:
          - all
          - dhanaerp-master-v16
          - dalali-v16
          - vincowoods-v16
      platform:
        description: Target platform
        required: true
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
      publish:
        description: Promote the verified staging digest to the official immutable source tag (main only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ndf-publish-${{ github.ref }}-${{ inputs.product || 'all' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare publishing matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Require the default branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.publish }}" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Official publication is permitted only from main." >&2
            exit 1
          fi

      - name: Configure product matrix
        id: set-matrix
        env:
          SELECTED_PRODUCT: ${{ inputs.product }}
        shell: bash
        run: |
          set -euo pipefail

          case "$SELECTED_PRODUCT" in
            all)
              PRODUCTS=("dhanaerp-master-v16" "dalali-v16" "vincowoods-v16")
              ;;
            dhanaerp-master-v16|dalali-v16|vincowoods-v16)
              PRODUCTS=("$SELECTED_PRODUCT")
              ;;
            *)
              echo "Unsupported product selection: $SELECTED_PRODUCT" >&2
              exit 1
              ;;
          esac

          MATRIX_JSON=$(printf '%s\n' "${PRODUCTS[@]}" | python -c '
          import json
          import sys
          images = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps({"image": images}))
          ')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_ID: ${{ matrix.image }}
      TARGET_PLATFORMS: ${{ inputs.platform }}
      BUILD_OUTPUT: .ndf-build/${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install build and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run NDF regression tests before staging
        run: python -m pytest -q images/ndf/tests/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image repository and source tag
        id: image
        run: |
          set -euo pipefail
          python images/ndf/scripts/resolve_publish_target.py \
            --image "$IMAGE_ID" \
            --sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
          IMAGE_REPOSITORY="$(awk -F= '$1 == "repository" { value=$2 } END { print value }' "$GITHUB_OUTPUT")"
          if [[ -z "$IMAGE_REPOSITORY" ]]; then
            echo "Unable to resolve configured image repository." >&2
            exit 1
          fi
          CANDIDATE_TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "candidate_ref=$IMAGE_REPOSITORY:$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure staging and official tags are unused
        env:
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_ref }}
          PUBLICATION_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$CANDIDATE_REF" >/dev/null 2>&1; then
            echo "Staging tag already exists: $CANDIDATE_REF" >&2
            exit 1
          fi
          if [[ "${{ inputs.publish }}" == "true" ]] && docker buildx imagetools inspect "$PUBLICATION_REF" >/dev/null 2>&1; then
            echo "Official immutable source tag already exists: $PUBLICATION_REF" >&2
            exit 1
          fi

      - name: Build staging image (not the official product tag)
        env:
          IMAGE_TAG: ${{ steps.image.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_OUTPUT"

          python images/ndf/scripts/build_image.py \
            --image "$IMAGE_ID" \
            --tag "$IMAGE_TAG" \
            --platform "$TARGET_PLATFORMS" \
            --output-dir "$BUILD_OUTPUT" \
            --cache-from "type=gha,scope=ndf-publish-$IMAGE_ID" \
            --cache-to "type=gha,mode=max,scope=ndf-publish-$IMAGE_ID" \
            --progress plain \
            --push

      - name: Verify staging digest metadata
        id: digest
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["BUILD_OUTPUT"]) / "build-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          digest = result.get("digest")
          if not result.get("pushed"):
              raise SystemExit("Build result does not confirm a registry push.")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("Buildx did not return a valid image digest.")
          print(f"digest={digest}")
          PY

      - name: Confirm staging tag resolves to the Buildx digest
        env:
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_ref }}
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$CANDIDATE_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Staging tag digest mismatch: expected $EXPECTED_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Pull staging image for validation
        run: docker pull "${{ steps.image.outputs.candidate_ref }}"

      - name: Validate staging image contents and metadata
        run: |
          set -euo pipefail
          python images/ndf/scripts/validate_image.py \
            --image "${{ steps.image.outputs.candidate_ref }}" \
            --metadata "$BUILD_OUTPUT/build-metadata.json" \
            --lock "$BUILD_OUTPUT/$IMAGE_ID.lock-v2.json" \
            --buildx-metadata "$BUILD_OUTPUT/buildx-metadata.json" \
            --inventory-output "$BUILD_OUTPUT/build-inventory.json" \
            --apps-json "$BUILD_OUTPUT/apps.json" \
            --composition-output "$BUILD_OUTPUT/image-composition-verification.json" \
            --verification-evidence-output "$BUILD_OUTPUT/image-verification-evidence.json" \
            --evidence-output "$BUILD_OUTPUT/build-evidence.json" \
            --source-provenance-output "$BUILD_OUTPUT/source-provenance.json" \
            --source-provenance-verification-output "$BUILD_OUTPUT/source-provenance-verification.json" \
            --post-cleanup-verification-output "$BUILD_OUTPUT/source-tree-verification-post-cleanup.json" \
            --runtime-verification-output "$BUILD_OUTPUT/source-tree-verification-runtime.json" \
            --report "$BUILD_OUTPUT/image-validation.json"

      - name: Verify publication gate
        run: |
          set -euo pipefail
          FRAMEWORK_MAJOR="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["framework"]["version"].split(".")[0])' "$BUILD_OUTPUT/build-metadata.json")"
          python images/ndf/scripts/gate_image_publication.py \
            --build-output-dir "$BUILD_OUTPUT" \
            --image-id "$IMAGE_ID" \
            --source-sha "$GITHUB_SHA" \
            --framework-major "$FRAMEWORK_MAJOR" \
            --candidate-image-ref "${{ steps.image.outputs.candidate_ref }}" \
            --publication-image-ref "${{ steps.image.outputs.image_ref }}" \
            --report "$BUILD_OUTPUT/publication-gate.json"

      - name: Promote verified digest to official source tag
        if: ${{ inputs.publish }}
        env:
          PUBLICATION_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$PUBLICATION_REF" "$IMAGE_REPOSITORY@$EXPECTED_DIGEST"
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$PUBLICATION_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Official publication digest mismatch: expected $EXPECTED_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Record staging-only result
        if: ${{ !inputs.publish }}
        run: echo "Verification gate passed. Official publication was not requested; no official product tag was created." >> "$GITHUB_STEP_SUMMARY"

      - name: Write publishing summary
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "## NDF product image verification and publication"
            echo
            echo "- Staging image: ${{ steps.image.outputs.candidate_ref }}"
            echo "- Validated digest: $IMAGE_DIGEST"
            echo "- Official source tag: ${{ steps.image.outputs.image_ref }}"
            echo "- Official publication requested: ${{ inputs.publish }}"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Platforms: $TARGET_PLATFORMS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publishing and validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ndf-publish-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ndf-build/${{ matrix.image }}/
          if-no-files-found: warn
          retention-days: 30
