name: NDF / Publish Product Images

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product image to publish
        required: true
        type: choice
        default: all
        options:
          - all
          - dhanaerp-master-v16
          - dalali-v16
          - vincowoods-v16
      platform:
        description: Target platform
        required: true
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
      publish:
        description: Promote the verified staging digest to the official immutable source tag (main only)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ndf-publish-${{ github.ref }}-${{ inputs.product || 'all' }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare publishing matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Require the default branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.publish }}" == "true" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Official publication is permitted only from main." >&2
            exit 1
          fi

      - name: Configure product matrix
        id: set-matrix
        env:
          SELECTED_PRODUCT: ${{ inputs.product }}
        shell: bash
        run: |
          set -euo pipefail

          case "$SELECTED_PRODUCT" in
            all)
              PRODUCTS=("dhanaerp-master-v16" "dalali-v16" "vincowoods-v16")
              ;;
            dhanaerp-master-v16|dalali-v16|vincowoods-v16)
              PRODUCTS=("$SELECTED_PRODUCT")
              ;;
            *)
              echo "Unsupported product selection: $SELECTED_PRODUCT" >&2
              exit 1
              ;;
          esac

          MATRIX_JSON=$(printf '%s\n' "${PRODUCTS[@]}" | python -c '
          import json
          import sys
          images = [line.strip() for line in sys.stdin if line.strip()]
          print(json.dumps({"image": images}))
          ')
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build-validate:
    name: Build and validate ${{ matrix.image }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_ID: ${{ matrix.image }}
      TARGET_PLATFORMS: ${{ inputs.platform }}
      BUILD_OUTPUT: .ndf-build/${{ matrix.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install build and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run NDF regression tests before staging
        run: python -m pytest -q images/ndf/tests/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image repository and source tag
        id: image
        run: |
          set -euo pipefail
          python images/ndf/scripts/resolve_publish_target.py \
            --image "$IMAGE_ID" \
            --sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
          IMAGE_REPOSITORY="$(awk -F= '$1 == "repository" { value=$2 } END { print value }' "$GITHUB_OUTPUT")"
          if [[ -z "$IMAGE_REPOSITORY" ]]; then
            echo "Unable to resolve configured image repository." >&2
            exit 1
          fi
          CANDIDATE_TAG="candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "candidate_tag=$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"
          echo "candidate_ref=$IMAGE_REPOSITORY:$CANDIDATE_TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure staging and official tags are unused
        env:
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_ref }}
          PUBLICATION_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          set -euo pipefail
          assert_tag_absent() {
            local ref="$1"
            local output
            if output="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
              echo "Registry tag already exists: $ref" >&2
              return 1
            fi
            if grep -Eqi 'not found|manifest unknown|404' <<< "$output"; then
              return 0
            fi
            echo "Unable to prove registry tag is absent: $ref" >&2
            echo "$output" >&2
            return 1
          }
          assert_tag_absent "$CANDIDATE_REF"
          if [[ "${{ inputs.publish }}" == "true" ]]; then
            assert_tag_absent "$PUBLICATION_REF"
          fi

      - name: Build staging image (not the official product tag)
        env:
          IMAGE_TAG: ${{ steps.image.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_OUTPUT"

          python images/ndf/scripts/build_image.py \
            --image "$IMAGE_ID" \
            --tag "$IMAGE_TAG" \
            --platform "$TARGET_PLATFORMS" \
            --output-dir "$BUILD_OUTPUT" \
            --cache-from "type=gha,scope=ndf-publish-$IMAGE_ID" \
            --cache-to "type=gha,mode=max,scope=ndf-publish-$IMAGE_ID" \
            --progress plain \
            --push

      - name: Verify staging digest metadata
        id: digest
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["BUILD_OUTPUT"]) / "build-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          digest = result.get("digest")
          if not result.get("pushed"):
              raise SystemExit("Build result does not confirm a registry push.")
          if not isinstance(digest, str) or not digest.startswith("sha256:"):
              raise SystemExit("Buildx did not return a valid image digest.")
          print(f"digest={digest}")
          PY

      - name: Confirm staging tag resolves to the Buildx digest
        env:
          CANDIDATE_REF: ${{ steps.image.outputs.candidate_ref }}
          EXPECTED_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$CANDIDATE_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Staging tag digest mismatch: expected $EXPECTED_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Pull staging image for validation
        run: docker pull "${{ steps.image.outputs.candidate_ref }}"

      - name: Validate staging image contents and metadata
        run: |
          set -euo pipefail
          python images/ndf/scripts/validate_image.py \
            --image "${{ steps.image.outputs.candidate_ref }}" \
            --metadata "$BUILD_OUTPUT/build-metadata.json" \
            --lock "$BUILD_OUTPUT/$IMAGE_ID.lock-v2.json" \
            --buildx-metadata "$BUILD_OUTPUT/buildx-metadata.json" \
            --inventory-output "$BUILD_OUTPUT/build-inventory.json" \
            --apps-json "$BUILD_OUTPUT/apps.json" \
            --composition-output "$BUILD_OUTPUT/image-composition-verification.json" \
            --verification-evidence-output "$BUILD_OUTPUT/image-verification-evidence.json" \
            --evidence-output "$BUILD_OUTPUT/build-evidence.json" \
            --source-provenance-output "$BUILD_OUTPUT/source-provenance.json" \
            --source-provenance-verification-output "$BUILD_OUTPUT/source-provenance-verification.json" \
            --post-cleanup-verification-output "$BUILD_OUTPUT/source-tree-verification-post-cleanup.json" \
            --runtime-verification-output "$BUILD_OUTPUT/source-tree-verification-runtime.json" \
            --report "$BUILD_OUTPUT/image-validation.json"

      - name: Verify publication gate
        run: |
          set -euo pipefail
          FRAMEWORK_MAJOR="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["framework"]["version"].split(".")[0])' "$BUILD_OUTPUT/build-metadata.json")"
          python images/ndf/scripts/gate_image_publication.py \
            --build-output-dir "$BUILD_OUTPUT" \
            --image-id "$IMAGE_ID" \
            --source-sha "$GITHUB_SHA" \
            --framework-major "$FRAMEWORK_MAJOR" \
            --candidate-image-ref "${{ steps.image.outputs.candidate_ref }}" \
            --publication-image-ref "${{ steps.image.outputs.image_ref }}" \
            --report "$BUILD_OUTPUT/publication-gate.json"

      - name: Generate deterministic image provenance
        run: |
          set -euo pipefail
          FRAMEWORK_MAJOR="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["framework"]["version"].split(".")[0])' "$BUILD_OUTPUT/build-metadata.json")"
          python images/ndf/scripts/generate_image_provenance.py \
            --build-output-dir "$BUILD_OUTPUT" \
            --image-id "$IMAGE_ID" \
            --framework-major "$FRAMEWORK_MAJOR" \
            --candidate-image-ref "${{ steps.image.outputs.candidate_ref }}" \
            --publication-image-ref "${{ steps.image.outputs.image_ref }}" \
            --predicate-output "$BUILD_OUTPUT/image-provenance-predicate.json" \
            --statement-output "$BUILD_OUTPUT/image-provenance-statement.json"

      - name: Record build and validation result
        run: echo "Build and validation completed. Official promotion, when requested, is handled by a separate trust-gated job." >> "$GITHUB_STEP_SUMMARY"

      - name: Write publishing summary
        env:
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          {
            echo "## NDF product image build and validation"
            echo
            echo "- Staging image: ${{ steps.image.outputs.candidate_ref }}"
            echo "- Validated digest: $IMAGE_DIGEST"
            echo "- Intended official source tag: ${{ steps.image.outputs.image_ref }}"
            echo "- Official publication requested: ${{ inputs.publish }}"\n            echo "- Official promotion: handled by a separate trust-gated job"
            echo "- Source commit: $GITHUB_SHA"
            echo "- Platforms: $TARGET_PLATFORMS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload publishing and validation artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ndf-publish-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ndf-build/${{ matrix.image }}/
          if-no-files-found: warn
          retention-days: 30

  # Signing is isolated from build, verification and promotion. Only this job
  # receives OIDC authority; it never promotes an image.
  sign-trust:
    name: Sign product image ${{ matrix.image }}
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [prepare, build-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install trust utility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Download build evidence from this run attempt
        uses: actions/download-artifact@v7
        with:
          name: ndf-publish-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ndf-build/${{ matrix.image }}

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image reference from validated evidence
        id: subject
        env:
          IMAGE_ID: ${{ matrix.image }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          output = Path(".ndf-build") / os.environ["IMAGE_ID"]
          metadata = json.loads((output / "build-metadata.json").read_text(encoding="utf-8"))
          result = json.loads((output / "build-result.json").read_text(encoding="utf-8"))
          repository = metadata.get("image", {}).get("repository")
          digest = result.get("digest")
          if result.get("pushed") is not True:
              raise SystemExit("Build result does not confirm a registry push.")
          if not isinstance(repository, str) or not repository.startswith("ghcr.io/"):
              raise SystemExit("Evidence does not identify an NDF GHCR image repository.")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[a-f0-9]{64}", digest) is None:
              raise SystemExit("Build evidence does not contain an immutable SHA-256 digest.")
          print(f"image_ref={repository}@{digest}")
          PY

      - name: Sign immutable image digest and SLSA provenance
        env:
          IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          IMAGE_ID: ${{ matrix.image }}
        run: |
          set -euo pipefail
          OUTPUT=".ndf-build/$IMAGE_ID"
          python images/ndf/scripts/cosign_image_trust.py sign \
            --image-ref "$IMAGE_REF" \
            --predicate "$OUTPUT/image-provenance-predicate.json" \
            --statement "$OUTPUT/image-provenance-statement.json" \
            | tee "$OUTPUT/cosign-sign-result.json"

      - name: Upload signing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ndf-cosign-sign-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ndf-build/${{ matrix.image }}/cosign-sign-result.json
            .ndf-build/${{ matrix.image }}/image-provenance-predicate.json
            .ndf-build/${{ matrix.image }}/image-provenance-statement.json
          if-no-files-found: warn
          retention-days: 90

  # This is an independent consumer job: it has no OIDC permission and does
  # not rely on the producer's local expected-predicate file for verification.
  verify-trust:
    name: Independently verify product trust for ${{ matrix.image }}
    if: ${{ always() && needs.build-validate.result == 'success' && needs.sign-trust.result == 'success' && github.ref == 'refs/heads/main' }}
    needs: [prepare, build-validate, sign-trust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install trust utility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Download build evidence from this run attempt
        uses: actions/download-artifact@v7
        with:
          name: ndf-publish-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ndf-build/${{ matrix.image }}

      - name: Download signing evidence from this run attempt
        uses: actions/download-artifact@v7
        with:
          name: ndf-cosign-sign-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ndf-build/${{ matrix.image }}/signing-evidence

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and correlate immutable image reference
        id: subject
        env:
          IMAGE_ID: ${{ matrix.image }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          root = Path(".ndf-build") / os.environ["IMAGE_ID"]
          metadata = json.loads((root / "build-metadata.json").read_text(encoding="utf-8"))
          result = json.loads((root / "build-result.json").read_text(encoding="utf-8"))
          signed = json.loads((root / "signing-evidence" / "cosign-sign-result.json").read_text(encoding="utf-8"))
          repository = metadata.get("image", {}).get("repository")
          digest = result.get("digest")
          if not isinstance(repository, str) or not repository.startswith("ghcr.io/"):
              raise SystemExit("Build evidence does not identify an NDF GHCR image repository.")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[a-f0-9]{64}", digest) is None:
              raise SystemExit("Build evidence does not contain an immutable SHA-256 digest.")
          image_ref = f"{repository}@{digest}"
          if signed.get("status") != "signed" or signed.get("image_repository") != repository or signed.get("image_digest") != digest:
              raise SystemExit("Signing evidence does not match the exact build image digest.")
          print(f"image_ref={image_ref}")
          PY

      - name: Independently verify signature, provenance and signer policy
        env:
          IMAGE_REF: ${{ steps.subject.outputs.image_ref }}
          IMAGE_ID: ${{ matrix.image }}
          PUBLISH_REQUESTED: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT=".ndf-build/$IMAGE_ID"
          VERIFY_LOG="$OUTPUT/cosign-independent-verification.log"
          RESULT="$OUTPUT/cosign-independent-verification-result.json"
          ATTESTATION_OUTPUT="$OUTPUT/cosign-independent-verified-attestation.json"

          set +e
          python images/ndf/scripts/cosign_image_trust.py verify \
            --image-ref "$IMAGE_REF" \
            --result-output "$RESULT" \
            --attestation-output "$ATTESTATION_OUTPUT" \
            --self-contained \
            --expected-product-id "$IMAGE_ID" \
            --expected-source-commit "$GITHUB_SHA" > "$VERIFY_LOG" 2>&1
          VERIFY_STATUS=$?
          set -e

          python - "$RESULT" "$IMAGE_REF" "$PUBLISH_REQUESTED" "$VERIFY_STATUS" <<'PY'
          import json
          import sys
          from pathlib import Path

          result_path = Path(sys.argv[1])
          image_ref, publish_requested = sys.argv[2], sys.argv[3] == "true"
          verify_status = int(sys.argv[4])
          if not result_path.is_file():
              raise SystemExit("Independent verifier did not produce a normalized trust result.")
          result = json.loads(result_path.read_text(encoding="utf-8"))
          if result.get("artifact", {}).get("immutable_reference") != image_ref:
              raise SystemExit("Trust result is not bound to the exact build digest.")
          for section in ("signature", "signer", "transparency"):
              if result.get(section, {}).get("verified") is not True:
                  raise SystemExit(f"{section} verification did not pass.")
          attestations = result.get("attestations")
          if not isinstance(attestations, list) or len(attestations) != 1 or attestations[0].get("verified") is not True:
              raise SystemExit("SLSA provenance attestation verification did not pass.")
          decision = result.get("decision", {})
          if decision.get("status") == "trusted" and verify_status == 0:
              raise SystemExit(0)
          provisional = (
              decision.get("status") == "rejected"
              and decision.get("reason_codes") == ["IDENTITY_POLICY_PROVISIONAL"]
              and verify_status != 0
          )
          if provisional and not publish_requested:
              print("Cryptographic verification passed; identity policy remains provisional. No promotion is permitted.")
              raise SystemExit(0)
          if provisional:
              raise SystemExit("Official promotion is blocked while signer identity policy remains provisional.")
          raise SystemExit("Trust verification failed or returned an unexpected decision.")
          PY

      - name: Upload independent trust verification evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ndf-cosign-verify-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ndf-build/${{ matrix.image }}/cosign-independent-verification.log
            .ndf-build/${{ matrix.image }}/cosign-independent-verification-result.json
            .ndf-build/${{ matrix.image }}/cosign-independent-verified-attestation.json
          if-no-files-found: warn
          retention-days: 90

  # Promotion has no OIDC authority and is reachable only after independent
  # verification accepts the exact image digest under a confirmed signer policy.
  promote:
    name: Promote trusted product image ${{ matrix.image }}
    if: ${{ always() && inputs.publish && needs.build-validate.result == 'success' && needs.verify-trust.result == 'success' }}
    needs: [prepare, build-validate, verify-trust]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Download build evidence from this run attempt
        uses: actions/download-artifact@v7
        with:
          name: ndf-publish-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ndf-build/${{ matrix.image }}

      - name: Download independent trust result from this run attempt
        uses: actions/download-artifact@v7
        with:
          name: ndf-cosign-verify-${{ matrix.image }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ndf-build/${{ matrix.image }}/trust-evidence

      - name: Validate trusted decision and exact digest
        id: subject
        env:
          IMAGE_ID: ${{ matrix.image }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          from pathlib import Path

          root = Path(".ndf-build") / os.environ["IMAGE_ID"]
          metadata = json.loads((root / "build-metadata.json").read_text(encoding="utf-8"))
          build = json.loads((root / "build-result.json").read_text(encoding="utf-8"))
          trust = json.loads((root / "trust-evidence" / "cosign-independent-verification-result.json").read_text(encoding="utf-8"))
          repository = metadata.get("image", {}).get("repository")
          digest = build.get("digest")
          if not isinstance(repository, str) or not repository.startswith("ghcr.io/"):
              raise SystemExit("Build evidence does not identify an NDF GHCR image repository.")
          if not isinstance(digest, str) or re.fullmatch(r"sha256:[a-f0-9]{64}", digest) is None:
              raise SystemExit("Build evidence does not contain a valid SHA-256 digest.")
          image_ref = f"{repository}@{digest}"
          if trust.get("artifact", {}).get("immutable_reference") != image_ref:
              raise SystemExit("Trust result refers to a different image digest.")
          if trust.get("decision", {}).get("status") != "trusted":
              raise SystemExit("Only an independently trusted image may be promoted.")
          for section in ("signature", "signer", "transparency"):
              if trust.get(section, {}).get("verified") is not True:
                  raise SystemExit(f"Required {section} verification is missing.")
          attestations = trust.get("attestations")
          if not isinstance(attestations, list) or len(attestations) != 1:
              raise SystemExit("Exactly one verified SLSA provenance attestation is required.")
          if attestations[0].get("verified") is not True or attestations[0].get("subject_digest") != digest:
              raise SystemExit("SLSA provenance is not verified against the promoted digest.")
          print(f"image_repository={repository}")
          print(f"image_digest={digest}")
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Promote only the independently trusted digest
        env:
          IMAGE_REPOSITORY: ${{ steps.subject.outputs.image_repository }}
          EXPECTED_DIGEST: ${{ steps.subject.outputs.image_digest }}
        run: |
          set -euo pipefail
          PUBLICATION_REF="${IMAGE_REPOSITORY}:v16-${GITHUB_SHA,,}"
          INSPECT_OUTPUT=""
          if INSPECT_OUTPUT="$(docker buildx imagetools inspect "$PUBLICATION_REF" 2>&1)"; then
            echo "Official immutable source tag already exists: $PUBLICATION_REF" >&2
            exit 1
          fi
          if ! grep -Eqi 'not found|manifest unknown|404' <<< "$INSPECT_OUTPUT"; then
            echo "Unable to prove official source tag is absent: $PUBLICATION_REF" >&2
            echo "$INSPECT_OUTPUT" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$PUBLICATION_REF" "${IMAGE_REPOSITORY}@${EXPECTED_DIGEST}"
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$PUBLICATION_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Official publication digest mismatch: expected $EXPECTED_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Write promotion summary
        env:
          IMAGE_REPOSITORY: ${{ steps.subject.outputs.image_repository }}
          IMAGE_DIGEST: ${{ steps.subject.outputs.image_digest }}
        run: |
          {
            echo "## NDF trusted product image promotion"
            echo
            echo "- Product: ${{ matrix.image }}"
            echo "- Official source tag: ${IMAGE_REPOSITORY}:v16-${GITHUB_SHA,,}"
            echo "- Immutable digest: ${IMAGE_DIGEST}"
            echo "- Independent trust decision: trusted"
          } >> "$GITHUB_STEP_SUMMARY"
