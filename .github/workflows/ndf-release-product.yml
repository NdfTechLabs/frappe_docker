name: NDF / Release Product Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v16- prefix (for example 1.0.0)
        required: true
        type: string
      source_sha:
        description: Full 40-character commit SHA of the already-published immutable image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ndf-release-dhanaerp-master-v16
  cancel-in-progress: false

jobs:
  release:
    name: Promote validated DhanaERP Master image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/ndftechlabs/dhanaerp-master
      FRAMEWORK_MAJOR: "16"
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate release inputs and require main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases are permitted only from main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be semantic MAJOR.MINOR.PATCH without a prefix." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character Git commit SHA." >&2
            exit 1
          fi
          echo "RELEASE_TAG=v${FRAMEWORK_MAJOR}-${RELEASE_VERSION}" >> "$GITHUB_ENV"
          echo "SOURCE_TAG=v${FRAMEWORK_MAJOR}-${SOURCE_SHA,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve and verify source image
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="${IMAGE_REPOSITORY}:${SOURCE_TAG}"
          if ! INSPECT_OUTPUT="$(docker buildx imagetools inspect "$SOURCE_REF" 2>&1)"; then
            echo "Published source image not found: $SOURCE_REF" >&2
            echo "$INSPECT_OUTPUT" >&2
            exit 1
          fi
          SOURCE_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ ! "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve a valid source image digest." >&2
            echo "$INSPECT_OUTPUT" >&2
            exit 1
          fi

          RELEASE_REF="${IMAGE_REPOSITORY}:${RELEASE_TAG}"
          if docker buildx imagetools inspect "$RELEASE_REF" >/dev/null 2>&1; then
            echo "Release tag already exists and will not be overwritten: $RELEASE_REF" >&2
            exit 1
          fi

          echo "source_digest=$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"
          echo "source_ref=${IMAGE_REPOSITORY}@${SOURCE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Promote the exact validated digest to the semantic version
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_REPOSITORY}:${RELEASE_TAG}" \
            "$SOURCE_REF"

      - name: Verify semantic release tag digest
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          set -euo pipefail
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${RELEASE_TAG}")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Release tag digest mismatch: expected $EXPECTED_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Promote and verify the stable channel
        shell: bash
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
          EXPECTED_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          set -euo pipefail
          STABLE_REF="${IMAGE_REPOSITORY}:v${FRAMEWORK_MAJOR}-latest"
          docker buildx imagetools create --tag "$STABLE_REF" "$SOURCE_REF"
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$STABLE_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Stable tag digest mismatch: expected $EXPECTED_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Write release summary
        shell: bash
        env:
          EXPECTED_DIGEST: ${{ steps.source.outputs.source_digest }}
        run: |
          {
            echo "## NDF product image release"
            echo
            echo "- Product: DhanaERP Master"
            echo "- Source: ${IMAGE_REPOSITORY}:${SOURCE_TAG}"
            echo "- Semantic release: ${IMAGE_REPOSITORY}:${RELEASE_TAG}"
            echo "- Stable channel: ${IMAGE_REPOSITORY}:v${FRAMEWORK_MAJOR}-latest"
            echo "- Immutable digest: ${EXPECTED_DIGEST}"
            echo
            echo "All release references were verified against the same digest."
          } >> "$GITHUB_STEP_SUMMARY"
