name: NDF / Release Product Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v16- prefix (for example 1.0.0)
        required: true
        type: string
      source_sha:
        description: Full 40-character commit SHA of the already-published immutable image
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ndf-release-dhanaerp-master-v16
  cancel-in-progress: false

jobs:
  verify-trust:
    name: Verify source image trust before release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    outputs:
      source_digest: ${{ steps.source.outputs.digest }}
      source_ref: ${{ steps.source.outputs.source_ref }}
      source_tag: ${{ steps.release-inputs.outputs.source_tag }}
      release_tag: ${{ steps.release-inputs.outputs.release_tag }}
    env:
      IMAGE_REPOSITORY: ghcr.io/ndftechlabs/dhanaerp-master
      FRAMEWORK_MAJOR: "16"
      RELEASE_VERSION: ${{ inputs.version }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_PRODUCT_ID: dhanaerp-master-v16
    steps:
      - name: Checkout trust verification code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install trust verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Validate release inputs and require main
        id: release-inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases are permitted only from main." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must be semantic MAJOR.MINOR.PATCH without a prefix." >&2
            exit 1
          fi
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Source SHA must be a full 40-character Git commit SHA." >&2
            exit 1
          fi
          printf 'release_tag=v%s-%s\n' "$FRAMEWORK_MAJOR" "$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'source_tag=v%s-%s\n' "$FRAMEWORK_MAJOR" "${SOURCE_SHA,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve immutable source image digest
        id: source
        env:
          SOURCE_TAG: ${{ steps.release-inputs.outputs.source_tag }}
          RELEASE_TAG: ${{ steps.release-inputs.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="${IMAGE_REPOSITORY}:${SOURCE_TAG}"
          if ! INSPECT_OUTPUT="$(docker buildx imagetools inspect "$SOURCE_REF" 2>&1)"; then
            echo "Published source image not found: $SOURCE_REF" >&2
            echo "$INSPECT_OUTPUT" >&2
            exit 1
          fi
          SOURCE_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ ! "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unable to resolve a valid source image digest." >&2
            exit 1
          fi
          RELEASE_REF="${IMAGE_REPOSITORY}:${RELEASE_TAG}"
          if docker buildx imagetools inspect "$RELEASE_REF" >/dev/null 2>&1; then
            echo "Release tag already exists and will not be overwritten: $RELEASE_REF" >&2
            exit 1
          fi
          printf 'digest=%s\n' "$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"
          printf 'source_ref=%s@%s\n' "$IMAGE_REPOSITORY" "$SOURCE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4

      - name: Independently verify source signature, SLSA provenance and release claims
        env:
          SOURCE_REF: ${{ steps.source.outputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ndf-release-trust"
          python images/ndf/scripts/cosign_image_trust.py verify \
            --image-ref "$SOURCE_REF" \
            --result-output "$RUNNER_TEMP/ndf-release-trust/verification-result.json" \
            --attestation-output "$RUNNER_TEMP/ndf-release-trust/verified-attestation.json" \
            --self-contained \
            --expected-product-id "$EXPECTED_PRODUCT_ID" \
            --expected-source-commit "$SOURCE_SHA"

      - name: Upload release trust evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ndf-release-trust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ndf-release-trust/
          if-no-files-found: warn
          retention-days: 90

  release:
    name: Promote independently trusted DhanaERP Master image
    needs: verify-trust
    if: ${{ needs.verify-trust.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/ndftechlabs/dhanaerp-master
      FRAMEWORK_MAJOR: "16"
      SOURCE_DIGEST: ${{ needs.verify-trust.outputs.source_digest }}
      SOURCE_TAG: ${{ needs.verify-trust.outputs.source_tag }}
      RELEASE_TAG: ${{ needs.verify-trust.outputs.release_tag }}
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Re-resolve source tag and enforce verified digest continuity
        env:
          EXPECTED_DIGEST: ${{ needs.verify-trust.outputs.source_digest }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REF="${IMAGE_REPOSITORY}:${SOURCE_TAG}"
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$SOURCE_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Source tag changed after trust verification: expected $EXPECTED_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi
          if [[ ! "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Verified source digest is invalid." >&2
            exit 1
          fi

      - name: Promote the exact verified digest to the semantic version
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_REF="${IMAGE_REPOSITORY}:${RELEASE_TAG}"
          if docker buildx imagetools inspect "$RELEASE_REF" >/dev/null 2>&1; then
            echo "Release tag already exists and will not be overwritten: $RELEASE_REF" >&2
            exit 1
          fi
          SOURCE_REF="${IMAGE_REPOSITORY}@${SOURCE_DIGEST}"
          docker buildx imagetools create --tag "$RELEASE_REF" "$SOURCE_REF"
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$RELEASE_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$SOURCE_DIGEST" ]]; then
            echo "Release tag digest mismatch: expected $SOURCE_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Promote and verify the stable channel
        shell: bash
        run: |
          set -euo pipefail
          STABLE_REF="${IMAGE_REPOSITORY}:v${FRAMEWORK_MAJOR}-latest"
          SOURCE_REF="${IMAGE_REPOSITORY}@${SOURCE_DIGEST}"
          docker buildx imagetools create --tag "$STABLE_REF" "$SOURCE_REF"
          INSPECT_OUTPUT="$(docker buildx imagetools inspect "$STABLE_REF")"
          ACTUAL_DIGEST="$(printf '%s\n' "$INSPECT_OUTPUT" | awk '/^Digest:/ {print $2; exit}')"
          if [[ "$ACTUAL_DIGEST" != "$SOURCE_DIGEST" ]]; then
            echo "Stable tag digest mismatch: expected $SOURCE_DIGEST, got $ACTUAL_DIGEST" >&2
            exit 1
          fi

      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## NDF product image release"
            echo
            echo "- Product: DhanaERP Master"
            echo "- Source: ${IMAGE_REPOSITORY}:${SOURCE_TAG}"
            echo "- Semantic release: ${IMAGE_REPOSITORY}:${RELEASE_TAG}"
            echo "- Stable channel: ${IMAGE_REPOSITORY}:v${FRAMEWORK_MAJOR}-latest"
            echo "- Immutable digest: ${SOURCE_DIGEST}"
            echo "- Independent signature, provenance, signer and transparency verification: passed"
          } >> "$GITHUB_STEP_SUMMARY"
