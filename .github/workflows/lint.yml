name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test image size checks
        run: python -m unittest discover -s .github/scripts -p 'test_image_sizes.py'

      # For shfmt pre-commit hook
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "^1.14"

      - name: Install pre-commit
        run: pip install -U pre-commit

      - name: Lint
        run: pre-commit run --color=always --all-files
        env:
          GO111MODULE: on

      - name: Upload formatted B.1 Python sources for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1-python-formatted
          path: |
            images/ndf/scripts/python_package_adapter.py
            images/ndf/tests/test_python_package_adapter.py
