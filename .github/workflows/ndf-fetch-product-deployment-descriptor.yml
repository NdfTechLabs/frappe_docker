name: NDF / Fetch Product Deployment Descriptor

on:
  workflow_dispatch:
    inputs:
      publication_run_id:
        description: Successful NDF PDD publication workflow run ID
        required: true
        type: string
      publication_artifact_name:
        description: Exact publication receipt artifact name
        required: true
        type: string

permissions:
  actions: read
  contents: read
  packages: read

concurrency:
  group: ndf-pdd-consumer-${{ inputs.publication_run_id }}
  cancel-in-progress: false

jobs:
  fetch:
    name: Retrieve PDD and record independent trust decision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLICATION_RUN_ID: ${{ inputs.publication_run_id }}
      PUBLICATION_ARTIFACT_NAME: ${{ inputs.publication_artifact_name }}
      GH_TOKEN: ${{ github.token }}
      RECEIPT_DIR: ${{ github.workspace }}/ndf-pdd-receipt
      OUTPUT_DIR: ${{ github.workspace }}/ndf-pdd-retrieved
    steps:
      - name: Checkout consumer implementation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Set up ORAS
        uses: oras-project/setup-oras@v2.0.3
        with:
          version: 1.3.6

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.4

      - name: Verify Cosign installation
        shell: bash
        run: |
          set -euo pipefail
          cosign version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate publication run and receipt ownership
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLICATION_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Invalid publication_run_id" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_RUN_ID" > "$RUNNER_TEMP/publication-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PUBLICATION_RUN_ID/artifacts?per_page=100" > "$RUNNER_TEMP/publication-artifacts.json"
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          run = json.loads(Path(os.environ["RUNNER_TEMP"], "publication-run.json").read_text())
          artifacts = json.loads(Path(os.environ["RUNNER_TEMP"], "publication-artifacts.json").read_text())
          run_id = os.environ["PUBLICATION_RUN_ID"]
          name = os.environ["PUBLICATION_ARTIFACT_NAME"]
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("PDD publication run must have completed successfully.")
          if run.get("path") != ".github/workflows/ndf-publish-product-deployment-descriptor.yml":
              raise SystemExit("Source run is not NDF / Publish Product Deployment Descriptor.")
          if run.get("head_branch") != "main":
              raise SystemExit("PDD publication must have run from main.")
          if str(run.get("id")) != run_id:
              raise SystemExit("Publication run ID mismatch.")
          match = re.fullmatch(r"ndf-pdd-publication-(\d+)-(\d+)", name)
          if not match:
              raise SystemExit("Invalid publication receipt artifact name.")
          # The first component is the source image-build run ID, not the
          # publication workflow run ID. Artifact ownership is established by
          # looking up this exact name in the supplied publication run.
          if int(match.group(2)) != run.get("run_attempt"):
              raise SystemExit("Receipt artifact attempt does not match the publication run attempt.")
          artifact = next((item for item in artifacts.get("artifacts", []) if item.get("name") == name), None)
          if not artifact or artifact.get("expired"):
              raise SystemExit("Publication receipt artifact is missing or expired.")
          print(f"Publication run: {run['html_url']}")
          print(f"Receipt artifact: {name}")
          PY

      - name: Download publication receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RECEIPT_DIR" "$OUTPUT_DIR"
          gh run download "$PUBLICATION_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PUBLICATION_ARTIFACT_NAME" --dir "$RECEIPT_DIR"
          test -s "$RECEIPT_DIR/pdd-publication-record.json"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate ORAS to GHCR
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Independently verify PDD and source image trust
        id: fetch_consumer
        shell: bash
        run: |
          set -euo pipefail
          REPORT_PATH="$OUTPUT_DIR/pdd-consumer-verification-report.json"
          PDD_RESULT_PATH="$OUTPUT_DIR/pdd-trust-result.json"
          PDD_ATTESTATION_PATH="$OUTPUT_DIR/pdd-verified-attestation.json"
          IMAGE_RESULT_PATH="$OUTPUT_DIR/image-trust-result.json"
          IMAGE_ATTESTATION_PATH="$OUTPUT_DIR/image-verified-attestation.json"
          CLI_OUTPUT="$RUNNER_TEMP/pdd-consumer-cli-output.json"

          set +e
          python images/ndf/scripts/fetch_product_deployment_descriptor.py \
            --publication-record "$RECEIPT_DIR/pdd-publication-record.json" \
            --output-dir "$OUTPUT_DIR" \
            --pdd-trust-result-output "$PDD_RESULT_PATH" \
            --pdd-attestation-output "$PDD_ATTESTATION_PATH" \
            --image-trust-result-output "$IMAGE_RESULT_PATH" \
            --image-attestation-output "$IMAGE_ATTESTATION_PATH" \
            --consumer-report-output "$REPORT_PATH" \
            > "$CLI_OUTPUT"
          verification_status=$?
          set -e

          if [[ "$verification_status" -ne 0 && "$verification_status" -ne 2 ]]; then
            echo "Consumer verification failed with technical/unexpected exit code $verification_status." >&2
            cat "$CLI_OUTPUT" >&2 || true
            exit "$verification_status"
          fi

          test -s "$REPORT_PATH"
          test -s "$PDD_RESULT_PATH"
          test -s "$PDD_ATTESTATION_PATH"
          test -s "$IMAGE_RESULT_PATH"
          test -s "$IMAGE_ATTESTATION_PATH"

          VERIFICATION_EXIT_CODE="$verification_status" \
          REPORT_PATH="$REPORT_PATH" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          exit_code = int(os.environ["VERIFICATION_EXIT_CODE"])
          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          if report.get("execution", {}).get("status") != "completed":
              raise SystemExit("Consumer report does not record completed technical execution.")
          if report.get("deployment_authorization") != "not_granted":
              raise SystemExit("Consumer report must not grant deployment authorization.")
          if report.get("evidence", {}).get("binding_status") != "passed":
              raise SystemExit("Consumer report does not confirm evidence binding.")
          required_stages = (
              "pdd_retrieval",
              "pdd_trust",
              "image_trust",
              "provenance_correlation",
              "evidence_binding",
          )
          stages = report.get("execution", {}).get("stages", {})
          if not all(stages.get(stage) == "passed" for stage in required_stages):
              raise SystemExit("Consumer report does not record every required stage as passed.")
          for artifact_name in ("pdd", "source_image"):
              artifact = report.get(artifact_name, {})
              if not all(artifact.get(key) is True for key in (
                  "signature_verified",
                  "signer_verified",
                  "transparency_verified",
              )):
                  raise SystemExit(f"{artifact_name} cryptographic verification flags are incomplete.")
          if not all(report.get("correlation", {}).get(key) is True for key in (
              "pdd_subject_matches",
              "descriptor_matches",
              "image_repository_matches",
              "image_digest_matches",
              "image_platform_matches",
              "image_source_sha_verified",
              "predicate_hash_matches",
          )):
              raise SystemExit("Consumer report is missing a required successful correlation.")

          decision = report.get("trust_decision", {})
          pdd_decision = report.get("pdd", {}).get("trust_decision")
          image_decision = report.get("source_image", {}).get("trust_decision")
          reasons = decision.get("reason_codes")
          policy_status = report.get("policy", {}).get("status")

          if exit_code == 0:
              if not (
                  policy_status == "confirmed"
                  and decision.get("status") == "trusted"
                  and pdd_decision == "trusted"
                  and image_decision == "trusted"
                  and reasons == []
                  and report.get("pdd", {}).get("trust_reason_codes") == []
                  and report.get("source_image", {}).get("trust_reason_codes") == []
              ):
                  raise SystemExit("Exit 0 did not correlate with two trusted identities under confirmed policy.")
              outcome = "trusted"
          else:
              expected_reason = ["IDENTITY_POLICY_PROVISIONAL"]
              if not (
                  policy_status == "provisional_until_live_certificate_observation"
                  and decision.get("status") == "rejected"
                  and reasons == expected_reason
                  and pdd_decision == "rejected"
                  and image_decision == "rejected"
                  and report.get("pdd", {}).get("trust_reason_codes") == expected_reason
                  and report.get("source_image", {}).get("trust_reason_codes") == expected_reason
              ):
                  raise SystemExit("Exit 2 is not the exact dual-provisional rejection.")
              outcome = "provisional_rejected"

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"trust_outcome={outcome}\n")
              output.write(f"consumer_exit_code={exit_code}\n")
          print(f"Consumer execution completed; trust outcome: {outcome}.")
          PY
          cat "$CLI_OUTPUT"

      - name: Upload retrieved PDD and independent trust evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ndf-pdd-consumer-${{ inputs.publication_run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.RECEIPT_DIR }}
            ${{ env.OUTPUT_DIR }}
            ${{ runner.temp }}/pdd-consumer-cli-output.json
          if-no-files-found: warn
          retention-days: 90

      - name: Write consumer verification summary
        if: always()
        env:
          TRUST_OUTCOME: ${{ steps.fetch_consumer.outputs.trust_outcome }}
          CONSUMER_EXIT_CODE: ${{ steps.fetch_consumer.outputs.consumer_exit_code }}
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["OUTPUT_DIR"], "pdd-consumer-verification-report.json")
          print("## Product Deployment Descriptor Consumer Verification")
          print()
          if not report_path.is_file():
              print("**NO COMPLETE CONSUMER REPORT — verification did not reach a reportable terminal state.**")
              print(f"- CLI output: `{Path(os.environ['RUNNER_TEMP'], 'pdd-consumer-cli-output.json')}`")
              raise SystemExit(0)

          report = json.loads(report_path.read_text(encoding="utf-8"))
          decision = report["trust_decision"]
          print(f"- Technical execution: **{report['execution']['status']}**")
          print(f"- Trust decision: **{decision['status'].upper()}**")
          print(f"- Trust reason codes: `{', '.join(decision['reason_codes']) or 'none'}`")
          print(f"- Identity policy: `{report['policy']['status']}`")
          print(f"- PDD signer decision: **{report['pdd']['trust_decision']}**")
          print(f"- Source-image signer decision: **{report['source_image']['trust_decision']}**")
          print(f"- PDD: `{report['pdd']['immutable_reference']}`")
          print(f"- Source image: `{report['source_image']['immutable_reference']}`")
          print(f"- Evidence binding: **{report['evidence']['binding_status']}** ({report['evidence']['published_file_count']} files)")
          print(f"- Deployment authorization: **{report['deployment_authorization']}**")
          print(f"- Workflow classification: `{os.environ.get('TRUST_OUTCOME') or 'not_completed'}`")
          print(f"- Consumer CLI exit code: `{os.environ.get('CONSUMER_EXIT_CODE') or 'unavailable'}`")
          print()
          if decision["status"] == "rejected":
              print("> **REJECTED — cryptographic and evidence checks completed, but signer identity policy remains provisional. This result is not trusted and does not authorize deployment.**")
          else:
              print("> **TRUSTED — both artifact identities were independently verified under confirmed policy. Deployment authorization remains not granted by this workflow.**")
          PY
